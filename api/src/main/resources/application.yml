spring:
  application:
    name: chartering-api
  profiles:
    default: dev               # overridden by SPRING_PROFILES_ACTIVE=docker in the container
  # Flyway owns the schema. It runs on startup, before Hibernate is given the
  # DataSource, so by the time validate below has an opinion the database is
  # already at the newest migration this build carries. Adding a column is a new
  # file in db/migration and a restart - see db/MIGRATIONS.md.
  flyway:
    enabled: true
    locations: classpath:db/migration

    # Adopting a database that already exists. A database with tables but no
    # flyway_schema_history is stamped as being at V1 - the schema already in place -
    # and V1 is recorded rather than run, which is what keeps this from trying to
    # CREATE TABLE over live data. An empty database is not baselined: it has nothing
    # to adopt, so it runs V1 forward and comes up with the schema and no rows.
    #
    # The databases in use were adopted before this repo stopped carrying data, so
    # they carry a baseline of 2 rather than 1. That is harmless - nothing above it
    # is pending either way - and it is recorded history, so it stays as it is.
    #
    # Left on deliberately, and it is the one setting here with a sharp edge: it
    # means a database that turns up unexpectedly populated is quietly adopted
    # instead of failing loudly. That is the behaviour worth having while databases
    # restored from a backup still need adopting. Turn it off once every database in
    # play was built by Flyway from empty.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing database adopted at V1"

    # Refuse to start against a database whose applied migrations no longer match
    # the files in this build - an edited V1, a deleted V3, a checksum that moved.
    # Failing at startup is the cheap version of that discovery.
    validate-on-migrate: true

  jpa:
    hibernate:
      # Second opinion, not the mechanism: Flyway has already built the schema, and
      # this catches the case where an entity changed and its migration was
      # forgotten. Hibernate never writes DDL here.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Timestamps go to the database as UTC instants and come back in the JVM's zone
          # (TZ, set on the container — see .env.example). The application itself works in
          # local wall-clock time throughout; this is only the wire format, and keeping it
          # absolute is what lets the display zone be changed without rewriting history.
          time_zone: UTC

  # SMTP transport for circulars. Defaults target Zoho's EU data centre on implicit
  # SSL (465). For STARTTLS instead, set MAIL_PORT=587, MAIL_SSL=false, MAIL_STARTTLS=true.
  # MAIL_USERNAME is the full mailbox address; MAIL_PASSWORD must be an app-specific
  # password when two-factor auth is on the Zoho account (a normal password is rejected).
  mail:
    host: ${MAIL_HOST:smtp.zoho.eu}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:true}
            trust: ${MAIL_HOST:smtp.zoho.eu}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 15000
          timeout: 30000
          writetimeout: 30000

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Pacing and safety rails for bulk circulars — see MailCampaignProperties for what
# each one protects against. Off by default: the app refuses to send until you set
# MAIL_ENABLED=true along with real credentials.
chartering:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Chartering Desk}
    reply-to: ${MAIL_REPLY_TO:}
    unsubscribe-mailto: ${MAIL_UNSUBSCRIBE:}
    min-delay-ms: ${MAIL_MIN_DELAY_MS:3000}
    max-delay-ms: ${MAIL_MAX_DELAY_MS:10000}
    max-recipients-per-campaign: ${MAIL_MAX_RECIPIENTS:200}
    batch-pause-ms: ${MAIL_BATCH_PAUSE_MS:900000}
    max-retries: ${MAIL_MAX_RETRIES:2}
    retry-backoff-ms: ${MAIL_RETRY_BACKOFF_MS:10000}
    abort-after-consecutive-failures: ${MAIL_ABORT_AFTER_FAILURES:5}
    log-file: ${MAIL_LOG_FILE:logs/campaign-current.log}

  # Reading the mailbox: the Mailbox tab's IMAP sync. Separate from the sending block
  # above because reading and sending fail independently — a broken IMAP host must not
  # stop a circular going out, and a spent sending quota must not stop the inbox
  # refreshing. The credentials default to the SMTP ones, since the usual case is one
  # mailbox both read and written by the same account.
  #
  # The mailbox is opened READ-ONLY. Nothing is ever written back to it: folders and
  # filing rules are the app's own, so a mis-written rule can only rearrange rows here.
  mailbox:
    enabled: ${IMAP_ENABLED:false}
    host: ${IMAP_HOST:imap.zoho.eu}
    port: ${IMAP_PORT:993}
    ssl: ${IMAP_SSL:true}
    username: ${IMAP_USERNAME:${MAIL_USERNAME:}}
    password: ${IMAP_PASSWORD:${MAIL_PASSWORD:}}
    folder: ${IMAP_FOLDER:INBOX}
    poll-interval-ms: ${IMAP_POLL_MS:300000}
    initial-sync-days: ${IMAP_INITIAL_DAYS:30}
    max-messages-per-poll: ${IMAP_MAX_PER_POLL:200}
    max-body-chars: ${IMAP_MAX_BODY_CHARS:200000}
    connect-timeout-ms: ${IMAP_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${IMAP_READ_TIMEOUT_MS:30000}

  # The second circular flow: Brevo's transactional API instead of the mailbox over SMTP.
  # Which of the two is used is a runtime setting ("Use Brevo for circs" on the Settings tab),
  # not an environment variable — only the key lives here, because it is a credential.
  #
  # The pacing below is Brevo's own baseline, and it is much faster than the SMTP one on
  # purpose: the mailbox rails exist to keep a personal account from being suspended, while
  # Brevo is built to be sent through in bulk and only its daily plan allowance really binds.
  # These are defaults, not limits — the Settings tab tunes them per provider.
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    connect-timeout-ms: ${BREVO_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${BREVO_READ_TIMEOUT_MS:30000}
    daily-limit: ${BREVO_DAILY_LIMIT:300}
    min-delay-ms: ${BREVO_MIN_DELAY_MS:200}
    max-delay-ms: ${BREVO_MAX_DELAY_MS:800}
    max-recipients-per-campaign: ${BREVO_MAX_RECIPIENTS:500}
    batch-pause-ms: ${BREVO_BATCH_PAUSE_MS:60000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chartering}
    username: ${DB_USER:chartering_user}
    password: ${DB_PASSWORD:password}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: docker
  # The compose default is the db service beside this container. Point DB_URL at a
  # managed Postgres and nothing else here changes - see db/CLOUD.md. Credentials are
  # read from the environment rather than written here so that .env is the only place
  # they live; the note at the top of .env.example used to say "update that profile
  # too", and this is what removes the need.
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/chartering}
    username: ${DB_USER:chartering_user}
    password: ${DB_PASSWORD:password}

    # Sized for a database on the other side of this machine, not the other side of the
    # network. The defaults are HikariCP's own and are right for the local container.
    #
    # A serverless provider wants the opposite: DB_POOL_MIN_IDLE=0 with a short idle
    # timeout lets the pool drain to nothing, which is what allows the database to
    # suspend and is how a free tier metered on compute hours stays free. The cost is a
    # cold start on the first query after a quiet spell. See db/CLOUD.md.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECT_TIMEOUT_MS:30000}
  jpa:
    show-sql: false

# WORKDIR is /app in the container; compose bind-mounts ./logs there so the campaign
# log outlives container recreation and can be opened directly on the host.
chartering:
  mail:
    log-file: ${MAIL_LOG_FILE:/app/logs/campaign-current.log}
