name: CI

# The build and the tests, on every pull request and every push to main. Until this existed
# nothing ran them except a person remembering to, and the Claude loops being told to in their
# prompts: a PR could be merged with a failing test and `render` deployed from it.
#
# Build and test only. It never deploys, never comments and needs no secrets, so it is safe on a
# pull request from anywhere.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The integration tests start pgvector/pgvector:pg16 through Testcontainers, which the
      # hosted runner's Docker serves without any setup here.
      - name: Test
        run: mvn -B -ntp verify

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # tsc --noEmit then vite build: a type error fails it.
      - name: Build
        run: npm run build
