# The chartering application: Spring Boot API + React/nginx UI. Two services, both
# built from this repo.
#
#   docker compose up -d --build        # build images, start everything
#   docker compose down                 # stop
#
# There is no database here. The api talks to whatever DB_URL points at - the hosted
# Postgres in normal use, or the separate chartering-db project beside this one for
# working offline. That is why this file has no db service, no data volume and no
# "down -v": nothing in this project holds state, so stopping it never costs anything.
#
# The database being configuration rather than a service is what lets this repo be
# only the application. Point DB_URL somewhere else and nothing here changes.
#
# Compose project name is fixed to "chartering" so container names are stable
# (chartering-api-1, chartering-ui-1). The two services reach each other by service
# name over the default network.
name: chartering

services:
  api:
    build: ./api
    restart: unless-stopped
    # Reaches a database outside this project. host-gateway is what makes
    # host.docker.internal resolve to the machine running docker, so a Postgres
    # published on a host port - the chartering-db project's 5433 - is reachable from
    # in here. Docker Desktop provides the name anyway; this line is what makes the
    # same compose file work on Linux, where it does not.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Where the database is, and it is not in this project. Set DB_URL in .env to
      # the hosted Postgres; the README is the walkthrough.
      #
      # A cloud URL needs TLS, which for pgjdbc is a query parameter on the url itself:
      #   DB_URL=jdbc:postgresql://HOST/DB?sslmode=require
      #
      # The default below is the chartering-db project beside this one, published on
      # host port 5433. Unset DB_URL and start nothing else, and the api will come up
      # unable to connect - which is correct: a database it does not own is not
      # something this file can conjure.
      #
      # The real default is written out here rather than left to application.yml, for
      # the same reason IMAP_USERNAME's fallback is done here: compose always defines a
      # mapped variable, so "DB_URL: ${DB_URL:-}" with nothing in .env would arrive as an
      # empty string, and Spring resolves an empty value as a value - not as absent. Its
      # own ${DB_URL:default} would never fire and the app would start with no url at all.
      # Compose's :- treats empty and unset alike, so the default belongs on this side.
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5433/chartering}
      DB_USER: ${DB_USER:-chartering_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      # Connection pool, sized for a database in the next container. A serverless one
      # wants DB_POOL_MIN_IDLE=0 and a short idle timeout so the pool drains to nothing
      # and the database is allowed to suspend - which is what keeps a free tier metered
      # on compute hours free. Cost: a cold start after a quiet spell.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-600000}
      # Whether /actuator/health also checks the database. On a database that suspends when
      # idle, leave it false: a health check polled around the clock is a query polled
      # around the clock, and the database never gets to sleep.
      DB_HEALTH_CHECK: ${DB_HEALTH_CHECK:-true}
      # ---- the login ----
      # One account, and until AUTH_PASSWORD (or AUTH_PASSWORD_HASH) is set the api starts
      # normally and refuses every login, saying so in its log. There is deliberately no
      # working default: a default password on something reachable from a network is the
      # same as no password.
      #
      # JWT_SECRET signs the tokens. Left unset the api generates a key at boot, which
      # works but logs you out on every `up -d --force-recreate` - fine locally, wrong
      # anywhere else. 32 characters minimum.
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-720}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-300}
      # Only matters when the browser reaches the api on a different origin than it loaded
      # from. Behind the ui's nginx proxy it never does.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Swagger. On by default because this compose file is the local setup; the Render
      # blueprint turns it off.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # The zone the API treats as local. Everything it timestamps — circulation history,
      # the campaign log — and every "today" it counts is wall-clock time in this zone; a
      # container with no TZ would run on UTC and roll the day over at the wrong hour.
      TZ: ${TZ:-Europe/Warsaw}
      # Circulars / SMTP. All optional: with MAIL_ENABLED unset the app starts normally and
      # the Circulars tab explains what is missing instead of offering a Send button.
      # Set these in .env (see .env.example) — never commit real credentials.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.zoho.eu}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Chartering Desk}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_UNSUBSCRIBE: ${MAIL_UNSUBSCRIBE:-}
      MAIL_MIN_DELAY_MS: ${MAIL_MIN_DELAY_MS:-3000}
      MAIL_MAX_DELAY_MS: ${MAIL_MAX_DELAY_MS:-10000}
      MAIL_MAX_RECIPIENTS: ${MAIL_MAX_RECIPIENTS:-200}
      MAIL_BATCH_PAUSE_MS: ${MAIL_BATCH_PAUSE_MS:-900000}
      MAIL_MAX_RETRIES: ${MAIL_MAX_RETRIES:-2}
      MAIL_RETRY_BACKOFF_MS: ${MAIL_RETRY_BACKOFF_MS:-10000}
      MAIL_ABORT_AFTER_FAILURES: ${MAIL_ABORT_AFTER_FAILURES:-5}
      # Reading the mailbox: the Mailbox tab's IMAP sync. Configured separately from the
      # sending block above because the two fail independently — an unreachable IMAP host
      # must not stop a circular going out. The mailbox is opened read-only.
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-imap.zoho.eu}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SSL: ${IMAP_SSL:-true}
      # The fallback to the SMTP credentials is done HERE rather than in application.yml,
      # and it has to be. Compose always defines a mapped variable, so an unset
      # IMAP_USERNAME in .env would arrive as an empty string — which Spring resolves as
      # the empty value, not as "absent", so its own ${IMAP_USERNAME:${MAIL_USERNAME:}}
      # default would never fire. Compose's :- treats empty and unset alike, so the
      # fallback works here and the app is handed one already-resolved value.
      IMAP_USERNAME: ${IMAP_USERNAME:-${MAIL_USERNAME:-}}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-${MAIL_PASSWORD:-}}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_POLL_MS: ${IMAP_POLL_MS:-300000}
      IMAP_INITIAL_DAYS: ${IMAP_INITIAL_DAYS:-30}
      IMAP_MAX_PER_POLL: ${IMAP_MAX_PER_POLL:-200}
      IMAP_MAX_BODY_CHARS: ${IMAP_MAX_BODY_CHARS:-200000}
      IMAP_CONNECT_TIMEOUT_MS: ${IMAP_CONNECT_TIMEOUT_MS:-15000}
      IMAP_READ_TIMEOUT_MS: ${IMAP_READ_TIMEOUT_MS:-30000}
      # Keeping incoming mail as training data for a model that reads cargo offers and
      # vessel positions — the Analysis tab. ON here and off on Render: it is a workbench
      # for long labelling sittings against a local database, not something a sleeping free
      # instance should be accumulating. Turning it off hides the tab and 404s its API.
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-true}
      ANALYSIS_MAX_BODY_CHARS: ${ANALYSIS_MAX_BODY_CHARS:-20000}
      ANALYSIS_MAX_CAPTURE: ${ANALYSIS_MAX_CAPTURE:-500}
      # The other circular flow: Brevo's transactional API. Which of the two is used is a
      # runtime setting ("Use Brevo for circs" on the Settings tab), so only the key and
      # Brevo's own pacing baseline come from the environment. An empty key just means the
      # Settings tab has nothing to switch to.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_DAILY_LIMIT: ${BREVO_DAILY_LIMIT:-300}
      BREVO_MIN_DELAY_MS: ${BREVO_MIN_DELAY_MS:-200}
      BREVO_MAX_DELAY_MS: ${BREVO_MAX_DELAY_MS:-800}
      BREVO_MAX_RECIPIENTS: ${BREVO_MAX_RECIPIENTS:-500}
      BREVO_BATCH_PAUSE_MS: ${BREVO_BATCH_PAUSE_MS:-60000}
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      # Campaign log lands on the host so it outlives container recreation and can be opened
      # directly. A run that finished clean is overwritten by the next one; a run that failed,
      # aborted or was interrupted is rotated to a timestamped file instead of being lost.
      - ./logs:/app/logs

  ui:
    build: ./ui
    restart: unless-stopped
    depends_on:
      - api
    # nginx's config is rendered from a template at container start, so where the api lives
    # and which port to listen on are environment, not a baked-in file. The Dockerfile's
    # defaults are exactly these two values - they are written out here so that what this
    # container is doing is readable without opening the Dockerfile.
    environment:
      API_HOST: api:8081
      PORT: 80
    ports:
      - "${UI_PORT:-8082}:80"
