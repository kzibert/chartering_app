# Self-contained chartering stack: Postgres (seeded from the bundled dump) +
# Spring Boot API + React/nginx UI. No dependency on any external project or network.
#
#   docker compose up -d --build        # build images, start everything
#   docker compose down                 # stop (keeps data volume)
#   docker compose down -v              # stop + wipe DB (next up re-seeds from db/seed)
#
# Compose project name is fixed to "chartering" so container/volume/network names are
# stable and prefixed (chartering-db-1, chartering_db_data, ...). Services reach each
# other by service name (db / api) over the default network.
name: chartering

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chartering_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-chartering}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # *.sql here runs once on first init (empty volume) -> seeds schema + data.
      - ./db/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chartering_user} -d ${POSTGRES_DB:-chartering}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Circulars / SMTP. All optional: with MAIL_ENABLED unset the app starts normally and
      # the Circulars tab explains what is missing instead of offering a Send button.
      # Set these in .env (see .env.example) — never commit real credentials.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.zoho.eu}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Chartering Desk}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_UNSUBSCRIBE: ${MAIL_UNSUBSCRIBE:-}
      MAIL_MIN_DELAY_MS: ${MAIL_MIN_DELAY_MS:-3000}
      MAIL_MAX_DELAY_MS: ${MAIL_MAX_DELAY_MS:-10000}
      MAIL_MAX_RECIPIENTS: ${MAIL_MAX_RECIPIENTS:-200}
      MAIL_BATCH_PAUSE_MS: ${MAIL_BATCH_PAUSE_MS:-900000}
      MAIL_MAX_RETRIES: ${MAIL_MAX_RETRIES:-2}
      MAIL_RETRY_BACKOFF_MS: ${MAIL_RETRY_BACKOFF_MS:-10000}
      MAIL_ABORT_AFTER_FAILURES: ${MAIL_ABORT_AFTER_FAILURES:-5}
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      # Campaign log lands on the host so it outlives container recreation and can be opened
      # directly. A run that finished clean is overwritten by the next one; a run that failed,
      # aborted or was interrupted is rotated to a timestamped file instead of being lost.
      - ./logs:/app/logs

  ui:
    build: ./ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${UI_PORT:-8082}:80"

volumes:
  db_data:
    driver: local
